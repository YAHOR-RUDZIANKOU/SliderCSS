<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="wrapper">
      <input type="radio" id="slide1" name="slide" class="checkbox" checked />
      <input type="radio" id="slide2" name="slide" class="checkbox" />
      <input type="radio" id="slide3" name="slide" class="checkbox" />
      <input type="radio" id="slide4" name="slide" class="checkbox" />
      <div class="slider__row">
        <div class="first__row">
          <div class="first__row-wrap">
            <img class="moto" src="/images/onePh.jpg" />
            <img class="moto" src="/images/twoPh (2).jpg" />
            <img class="moto" src="/images/threePh.jpg" />
            <img class="moto" src="/images/fourPh.jpg" />
          </div>
        </div>
        <div class="second__row">
          <div class="second__row-wrap">
            <div class="subtitle">Тут будет текст для первой картинки</div>
            <div class="subtitle">Тут будет текст для второй картинки</div>
            <div class="subtitle">Тут будет текст для третьей картинки</div>
            <div class="subtitle">Тут будет текст для четвертой картинки</div>
          </div>
          <div class="navigation">
            <label class="label" for="slide1" tabindex="0"><div class="bar bar1"></div></label>
            <label class="label" for="slide2" tabindex="0"><div class="bar bar2"></div></label>
            <label class="label" for="slide3" tabindex="0"><div class="bar bar3"></div></label>
            <label class="label" for="slide4" tabindex="0"><div class="bar bar4"></div></label>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
